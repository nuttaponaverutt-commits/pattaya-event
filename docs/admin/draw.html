<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lucky Draw</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #0b0b0a; --panel: #171612; --line: #2e2b24; --gold: #c9a24c; --gold-soft: #e9d6a6; --cream: #f4ecd8; --muted: #9a927f; --bad: #e07a7a;
      --display: "Bodoni Moda", "IBM Plex Sans Thai", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--cream); font-family: "IBM Plex Sans Thai", system-ui, sans-serif; }
    [hidden] { display: none !important; }
    .app { min-height: 100%; display: grid; grid-template-columns: 1fr 320px; }
    @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

    .stage {
      position: relative; display: grid; grid-template-rows: auto 1fr auto; padding: 32px 40px; min-height: 100vh;
      background: radial-gradient(ellipse at 50% 45%, rgba(201,162,76,.14) 0%, transparent 60%), var(--bg);
    }
    .brand { text-align: center; }
    .brand .ev { font-family: var(--display); font-style: italic; color: var(--gold); font-size: 22px; }
    .brand .round { font-family: var(--display); font-size: clamp(32px, 5vw, 56px); margin-top: 4px; letter-spacing: .02em; }
    .brand .pool { color: var(--muted); font-size: 15px; margin-top: 4px; }

    .center { display: grid; place-content: center; justify-items: center; text-align: center; gap: 18px; padding: 24px 0; position: relative; z-index: 2; }
    .name { font-size: clamp(40px, 7vw, 96px); font-weight: 600; line-height: 1.15; min-height: 1.2em; color: var(--cream); text-wrap: balance; }
    .name.win {
      background: linear-gradient(100deg, var(--gold-soft) 20%, #fff8e1 42%, var(--gold-soft) 64%);
      background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 34px rgba(201,162,76,.5));
      animation: pop .8s cubic-bezier(.2, 1.5, .4, 1), shine 2.8s linear .8s infinite;
    }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -160% 0; } }
    .kicker { font-family: var(--display); font-style: italic; color: var(--gold); font-size: clamp(20px, 2.6vw, 32px); min-height: 1.3em; opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s; }
    .kicker.show { opacity: 1; transform: none; }

    /* วงล้อรายชื่อแบบสล็อต: เห็น 3 แถว แถวกลางคือผู้โชคดี */
    .reel-win {
      --rh: 1.5em; position: relative; overflow: hidden; height: calc(var(--rh) * 3); width: min(92vw, 980px);
      font-size: clamp(30px, 5vw, 70px); font-weight: 600;
      -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
      mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    }
    .reel-frame { position: absolute; left: 50%; transform: translateX(-50%); width: min(92vw, 980px); height: calc(clamp(30px, 5vw, 70px) * 1.5); top: 50%; margin-top: calc(clamp(30px, 5vw, 70px) * -.75);
      border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(201,162,76,.10), transparent); }
    .reel-box { position: relative; display: grid; place-items: center; }
    .reel-box.spinning .reel-frame { animation: glow 1s ease-in-out infinite alternate; }
    @keyframes glow { from { box-shadow: 0 0 0 rgba(201,162,76,0); } to { box-shadow: 0 0 46px rgba(201,162,76,.35), inset 0 0 30px rgba(201,162,76,.15); } }
    .reel { will-change: transform; }
    .reel .cell { height: var(--rh); line-height: var(--rh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; color: var(--cream); }
    .reel.blur .cell { filter: blur(2px); opacity: .85; }
    .reel .cell { transition: filter .6s, opacity .6s; }
    .reel-box.landed .reel-frame { animation: none; box-shadow: 0 0 60px rgba(201,162,76,.55); }

    #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,240,200,.55), rgba(201,162,76,.15) 35%, transparent 65%); }
    .stage.flash::after { animation: flash 1.1s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .name.win { animation: none; } .reel-box.spinning .reel-frame { animation: none; } .stage.flash::after { animation: none; } }
    .sub { font-size: clamp(18px, 2.4vw, 28px); color: var(--gold-soft); min-height: 1.4em; }
    .tier { display: inline-block; padding: 6px 22px; border-radius: 999px; font-weight: 600; letter-spacing: .1em; font-size: 20px; }
    .tier-VVIP { background: var(--gold); color: #151412; }
    .tier-VIP { background: #151412; color: var(--gold-soft); border: 1px solid var(--gold); }
    .tier-Walk-in { background: #e7e2d6; color: #3a372f; }
    .idle { color: var(--muted); font-size: 20px; }

    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
    select, input { font: inherit; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
    button { font: inherit; cursor: pointer; border-radius: 8px; padding: 12px 20px; border: 1px solid var(--line); background: var(--panel); color: var(--cream); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .go { background: var(--gold); color: #151412; border-color: var(--gold); font-weight: 600; font-size: 20px; padding: 14px 36px; }
    .go[disabled] { opacity: .5; cursor: wait; }
    .void { border-color: var(--bad); color: var(--bad); }
    .stage.presenting .controls { opacity: .15; transition: opacity .3s; }
    .stage.presenting .controls:hover { opacity: 1; }

    aside { background: var(--panel); border-left: 1px solid var(--line); padding: 24px 20px; overflow: auto; max-height: 100vh; }
    @media (max-width: 900px) { aside { border-left: 0; border-top: 1px solid var(--line); max-height: none; } }
    aside h2 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0 0 14px; color: var(--gold-soft); }
    .w { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: grid; gap: 2px; }
    .w b { font-size: 16px; }
    .w .m { color: var(--muted); }
    .w.void b { text-decoration: line-through; color: var(--muted); }
    .login { max-width: 420px; margin: 20vh auto; text-align: center; padding: 0 16px; }
    .login a { color: var(--gold); }
    .err { color: var(--bad); min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="login" id="needLogin" hidden>
    <p>กรุณาเข้าสู่ระบบหลังบ้านก่อน</p>
    <p><a href="./">ไปหน้าเข้าสู่ระบบ Admin</a> แล้วกลับมาที่หน้านี้</p>
  </div>

  <div class="app" id="app" hidden>
    <main class="stage" id="stage">
      <div class="brand">
        <div class="ev" id="evName">Wine &amp; Spirits Discovery 2026</div>
        <div class="round" id="roundTitle">Lucky Draw #1</div>
        <div class="pool" id="poolText"></div>
      </div>

      <div class="center" aria-live="polite">
        <div class="kicker" id="kicker">ขอแสดงความยินดีกับผู้โชคดี</div>
        <div class="reel-box" id="reelBox" hidden>
          <div class="reel-win"><div class="reel" id="reel"></div></div>
          <div class="reel-frame"></div>
        </div>
        <div class="name idle" id="nameBox">พร้อมสุ่มรางวัล</div>
        <div class="sub" id="subBox"></div>
        <div id="tierBox"></div>
      </div>
      <canvas id="fx" aria-hidden="true"></canvas>

      <div>
        <div class="err" id="errBox"></div>
        <div class="controls">
          <select id="tier" aria-label="กลุ่มที่สุ่ม">
            <option value="">ทุกกลุ่ม</option>
            <option>VVIP</option>
            <option>VIP</option>
            <option>Walk-in</option>
          </select>
          <input id="round" value="Lucky Draw #1" maxlength="40" aria-label="ชื่อรอบ">
          <button class="go" id="goBtn">สุ่มรางวัล</button>
          <button class="void" id="voidBtn" hidden>ไม่อยู่ในงาน / สุ่มใหม่</button>
          <button id="fsBtn">เต็มจอ</button>
          <a href="./" style="color:var(--muted);font-size:14px">กลับหลังบ้าน</a>
        </div>
      </div>
    </main>

    <aside>
      <h2>ผู้โชคดี</h2>
      <div id="winners"><div class="w m">ยังไม่มี</div></div>
    </aside>
  </div>

  <script src="../assets/config.js"></script>
  <script src="../assets/common.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    const sess = loadSession('pe_admin');
    let lastWinner = null;
    let busy = false;

    if (!sess) {
      $('#needLogin').hidden = false;
    } else {
      $('#app').hidden = false;
      api('config').then(function (c) { if (c.ok && c.event_name) $('#evName').textContent = c.event_name; });
      loadWinners();
    }

    async function authed(action, data) {
      const res = await api(action, Object.assign({ token: sess.token }, data));
      if (res.auth === false) { $('#app').hidden = true; $('#needLogin').hidden = false; }
      return res;
    }

    $('#round').addEventListener('input', function () { $('#roundTitle').textContent = this.value || 'Lucky Draw'; });
    $('#fsBtn').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen().catch(function () {});
    });

    $('#goBtn').addEventListener('click', function () { draw(); });
    $('#voidBtn').addEventListener('click', async function () {
      if (!lastWinner || busy) return;
      busy = true; // กันกดซ้ำระหว่างรอ
      this.disabled = true;
      const res = await authed('draw_void', { reg_id: lastWinner.reg_id });
      this.disabled = false;
      busy = false;
      if (!res.ok) { $('#errBox').textContent = res.error; return; }
      loadWinners();
      draw();
    });

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let recentNames = []; // รายชื่อจากรอบก่อน ใช้หมุนระหว่างรอระบบสุ่ม
    let spinRaf = 0;

    async function draw() {
      if (busy) return;
      busy = true;
      $('#errBox').textContent = '';
      $('#goBtn').disabled = true;
      $('#voidBtn').hidden = true;
      $('#stage').classList.add('presenting');
      $('#kicker').classList.remove('show');
      $('#nameBox').hidden = true;
      $('#subBox').textContent = '';
      $('#tierBox').innerHTML = '';
      startSpin(); // หมุนทันทีที่กด ไม่ต้องรอระบบตอบ

      const res = await authed('draw', { tier: $('#tier').value, round: $('#round').value });
      if (!res.ok) {
        stopSpin();
        showIdle();
        // เน็ตหลุดตอนรอ: ระบบอาจสุ่มไปแล้ว ดึงรายชื่อผู้โชคดีมาแสดงก่อน กันสุ่มซ้ำโดยไม่รู้ตัว
        $('#errBox').textContent = res.network ? 'เชื่อมต่อไม่ได้ กรุณาดูรายชื่อผู้โชคดีด้านขวาก่อนกดสุ่มใหม่' : res.error;
        loadWinners();
        finish();
        return;
      }
      $('#poolText').textContent = 'ผู้มีสิทธิ์ลุ้น ' + res.pool_size + ' คน';
      if (res.names && res.names.length) recentNames = res.names.slice();
      const w = res.winner;
      lastWinner = w;
      await landOn(res.names, w.full_name);
      reveal(w);
      loadWinners();
      finish();
    }

    function finish() {
      busy = false;
      $('#goBtn').disabled = false;
      $('#stage').classList.remove('presenting');
    }

    function showIdle() {
      $('#reelBox').hidden = true;
      const nameBox = $('#nameBox');
      nameBox.hidden = false;
      nameBox.className = 'name idle';
      nameBox.textContent = 'พร้อมสุ่มรางวัล';
    }

    function fillReel(list) {
      $('#reel').innerHTML = list.map(function (n) { return '<div class="cell">' + esc(n) + '</div>'; }).join('');
    }
    function rowHeight() {
      const c = $('#reel').firstElementChild;
      return c ? c.getBoundingClientRect().height : 80;
    }

    // ช่วงรอระบบ: รายชื่อวิ่งเร็ววนไปเรื่อยๆ
    function startSpin() {
      if (reduce) return;
      const base = recentNames.length ? recentNames : ['✦', 'Wine & Spirits', '✦', 'Discovery 2026', '✦', 'Lucky Draw'];
      const list = [];
      for (let i = 0; i < 24; i++) list.push(base[i % base.length]);
      $('#reelBox').hidden = false;
      $('#reelBox').className = 'reel-box spinning';
      fillReel(list.concat(list));
      const reel = $('#reel');
      reel.style.transition = 'none';
      reel.classList.add('blur');
      const loop = list.length * rowHeight();
      let y = 0, last = performance.now();
      cancelAnimationFrame(spinRaf);
      (function frame(t) {
        y = (y + (t - last) * 2.4) % loop;
        last = t;
        reel.style.transform = 'translate3d(0,' + (-y) + 'px,0)';
        spinRaf = requestAnimationFrame(frame);
      })(last);
    }
    function stopSpin() { cancelAnimationFrame(spinRaf); }

    // ได้ผลแล้ว: วงล้อค่อยๆ ช้าลงจนผู้โชคดีหยุดตรงแถวกลาง (ประมาณ 5 วินาที)
    function landOn(names, winnerName) {
      return new Promise(function (resolve) {
        stopSpin();
        if (reduce) { setTimeout(resolve, 300); return; }
        const pool = names && names.length ? names : [winnerName];
        const pick = function () { return pool[Math.floor(Math.random() * pool.length)]; };
        const list = [];
        for (let i = 0; i < 52; i++) list.push(pick());
        list.push(winnerName, pick(), pick());
        $('#reelBox').hidden = false;
        $('#reelBox').className = 'reel-box spinning';
        fillReel(list);
        const reel = $('#reel');
        const h = rowHeight();
        const target = (list.length - 3 - 1) * h; // แถวบนสุดคือคนก่อนผู้โชคดี ผู้โชคดีจึงอยู่แถวกลาง
        reel.style.transition = 'none';
        reel.style.transform = 'translate3d(0,0,0)';
        reel.classList.add('blur');
        void reel.offsetHeight;
        reel.style.transition = 'transform 5.4s cubic-bezier(.06, .62, .1, 1)';
        reel.style.transform = 'translate3d(0,' + (-target) + 'px,0)';
        setTimeout(function () { reel.classList.remove('blur'); }, 3200);
        let done = false;
        const end = function () {
          if (done) return;
          done = true;
          $('#reelBox').className = 'reel-box landed';
          setTimeout(resolve, 650); // ค้างที่ชื่อผู้โชคดีให้ทุกคนเห็นก่อนประกาศ
        };
        reel.addEventListener('transitionend', end, { once: true });
        setTimeout(end, 5800);
      });
    }

    // ประกาศผู้โชคดี: แสงวาบ + ชื่อเด้งขึ้นพร้อมประกายทอง + กระดาษสีทอง
    function reveal(w) {
      $('#reelBox').hidden = true;
      const stage = $('#stage');
      stage.classList.remove('flash');
      void stage.offsetWidth;
      stage.classList.add('flash');
      $('#kicker').classList.add('show');
      const nameBox = $('#nameBox');
      nameBox.hidden = false;
      nameBox.className = 'name';
      void nameBox.offsetWidth;
      nameBox.className = 'name win';
      nameBox.textContent = w.full_name;
      $('#subBox').textContent = [w.company, w.phone_tail ? 'โทร xxx-xxx-' + w.phone_tail : ''].filter(Boolean).join('  ·  ');
      // ไม่แสดงป้ายกลุ่ม (VVIP / VIP / Walk-in) บนจอประกาศ
      $('#voidBtn').hidden = false;
      confetti();
    }

    function confetti() {
      if (reduce) return;
      const c = $('#fx');
      const g = c.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const W = c.clientWidth, H = c.clientHeight;
      c.width = W * dpr; c.height = H * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const colors = ['#c9a24c', '#e9d6a6', '#f4ecd8', '#b48d3e', '#fff3c4', '#8a6d2f'];
      const parts = [];
      const add = function (x, y, vx, vy, i) {
        parts.push({ x: x, y: y, vx: vx, vy: vy, w: 5 + Math.random() * 7, h: 9 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: colors[i % colors.length], star: Math.random() < .18 });
      };
      for (let i = 0; i < 240; i++) {
        const a = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 11;
        add(W / 2, H * .45, Math.cos(a) * sp, Math.sin(a) * sp - 5, i);
      }
      for (let i = 0; i < 140; i++) add(Math.random() * W, -20 - Math.random() * H * .7, (Math.random() - .5) * 1.5, 2 + Math.random() * 3, i);
      const start = performance.now(), DUR = 6500;
      (function frame(t) {
        const el = t - start;
        g.clearRect(0, 0, W, H);
        g.globalAlpha = Math.max(0, Math.min(1, (DUR - el) / 1500));
        parts.forEach(function (p) {
          p.vy += .11; p.vx *= .988; p.vy *= .988;
          p.x += p.vx; p.y += p.vy; p.r += p.vr;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.r);
          g.fillStyle = p.c;
          if (p.star) {
            g.beginPath();
            for (let k = 0; k < 8; k++) { const rad = k % 2 ? p.w * .35 : p.w; g.lineTo(Math.cos(k * Math.PI / 4) * rad, Math.sin(k * Math.PI / 4) * rad); }
            g.closePath(); g.fill();
          } else {
            const flip = Math.abs(Math.cos(p.r * 2));
            g.fillRect(-p.w / 2, -p.h * flip / 2, p.w, p.h * flip + 1);
          }
          g.restore();
        });
        if (el < DUR) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
      })(start);
    }

    async function loadWinners() {
      const res = await authed('draw_list', {});
      if (!res.ok) return;
      $('#winners').innerHTML = res.winners.length ? res.winners.map(function (w) {
        return '<div class="w' + (w.status === 'void' ? ' void' : '') + '"><b>' + esc(w.full_name) + '</b>' +
          '<span class="m">' + esc(w.round) + ' · ' + esc(w.time) + (w.status === 'void' ? ' · สละสิทธิ์' : '') + '</span></div>';
      }).join('') : '<div class="w m">ยังไม่มี</div>';
    }
  </script>
</body>
</html>
